global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'hermes-lab-monitor'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Hermes API metrics
  - job_name: 'hermes-api'
    static_configs:
      - targets: ['hermes-api:8000']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # n8n metrics (optional, if exposed)
  - job_name: 'n8n'
    static_configs:
      - targets: ['n8n:5678']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s
