services:
  # n8n Workflow Automation
  n8n-db:
    image: postgres:16-alpine
    container_name: hermes-n8n-db
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:-n8n-dev-password}
    volumes:
      - n8n-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hermes-lab

  n8n:
    image: n8nio/n8n:latest
    container_name: hermes-n8n
    depends_on:
      n8n-db:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:-n8n-dev-password}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: Europe/Berlin
      TZ: Europe/Berlin
    ports:
      - "5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - hermes-lab
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Hermes API (lokal)
  hermes-api:
    build:
      context: ./hermes-api
      dockerfile: Dockerfile
    container_name: hermes-api-local
    environment:
      VAULT_PATH: /vault
      LOG_LEVEL: debug
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_KEY: ${API_KEY:-hermes-dev-secret-key-change-in-production}
    ports:
      - "8000:8000"
    volumes:
      - vault-data:/vault
    networks:
      - hermes-lab
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Hermes Web UI (lokal)
  hermes-web-ui:
    build:
      context: ./hermes-web-ui
      dockerfile: Dockerfile
    container_name: hermes-web-ui-local
    environment:
      API_URL: http://hermes-api:8000
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      - hermes-api
    networks:
      - hermes-lab
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Monitoring: Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: hermes-prometheus
    environment:
      TZ: Europe/Berlin
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - hermes-lab

  # Monitoring: Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: hermes-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: 'grafana-piechart-panel'
      TZ: Europe/Berlin
    ports:
      - "3001:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - hermes-lab
    depends_on:
      - prometheus

  # Cloudflare Tunnel — externes Routing für alle Services
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: hermes-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /tmp/cloudflared-config.yml run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    volumes:
      - ./cloudflared-config.yml:/tmp/cloudflared-config.yml:ro
    networks:
      - hermes-lab
    depends_on:
      - n8n
      - grafana
      - prometheus

volumes:
  n8n-db-data:
    driver: local
  n8n-data:
    driver: local
  vault-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-storage:
    driver: local

networks:
  hermes-lab:
    driver: bridge
