---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vault-storage-pvc
  namespace: hermes
  labels:
    app: hermes-vault
    component: storage
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 50Gi

---
# Note: local-path provisioner creates storage on the node where the pod runs
# For HA with 3+ replicas, consider using NFS or another distributed storage solution
# See: https://docs.k3s.io/storage
