---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-api
  namespace: hermes
  labels:
    app: hermes-vault
    component: api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: hermes-vault
      component: api
  template:
    metadata:
      labels:
        app: hermes-vault
        component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: hermes-sa
      containers:
      - name: api
        image: hermes-api:latest
        imagePullPolicy: Never
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: VAULT_PATH
          value: "/vault"
        - name: LOG_LEVEL
          value: "info"
        - name: API_HOST
          value: "0.0.0.0"
        - name: API_PORT
          value: "8000"
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-api-secret   # kubectl create secret generic hermes-api-secret --from-literal=api-key=... -n hermes
              key: api-key
        volumeMounts:
        - name: vault-storage
          mountPath: /vault
        - name: tmp-dir
          mountPath: /tmp
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: vault-storage
        persistentVolumeClaim:
          claimName: vault-storage-pvc
      - name: tmp-dir
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - hermes-vault
                - key: component
                  operator: In
                  values:
                  - api
              topologyKey: kubernetes.io/hostname
