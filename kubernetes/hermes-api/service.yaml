---
apiVersion: v1
kind: Service
metadata:
  name: hermes-api
  namespace: hermes
  labels:
    app: hermes-vault
    component: api
spec:
  type: ClusterIP
  selector:
    app: hermes-vault
    component: api
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
  sessionAffinity: None
