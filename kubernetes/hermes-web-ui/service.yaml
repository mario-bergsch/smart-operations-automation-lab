---
apiVersion: v1
kind: Service
metadata:
  name: hermes-web-ui
  namespace: hermes
  labels:
    app: hermes-vault
    component: web-ui
spec:
  type: ClusterIP
  selector:
    app: hermes-vault
    component: web-ui
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  sessionAffinity: None
