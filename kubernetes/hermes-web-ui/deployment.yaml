---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-web-ui
  namespace: hermes
  labels:
    app: hermes-vault
    component: web-ui
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: hermes-vault
      component: web-ui
  template:
    metadata:
      labels:
        app: hermes-vault
        component: web-ui
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: hermes-sa
      containers:
      - name: web-ui
        image: hermes-web-ui:latest
        imagePullPolicy: Never
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: VAULT_PATH
          value: "/vault"
        - name: API_BASE_URL
          value: "http://hermes-api:8000"
        - name: LOG_LEVEL
          value: "info"
        volumeMounts:
        - name: vault-storage
          mountPath: /vault
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: vault-storage
        persistentVolumeClaim:
          claimName: vault-storage-pvc
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - hermes-vault
                - key: component
                  operator: In
                  values:
                  - web-ui
              topologyKey: kubernetes.io/hostname
