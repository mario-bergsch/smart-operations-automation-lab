---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-backup
  namespace: hermes
  labels:
    app: hermes-vault
    component: backup
spec:
  schedule: "0 2 * * *"  # Daily at 02:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 10
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: hermes-vault
            component: backup
        spec:
          serviceAccountName: hermes-sa
          restartPolicy: OnFailure
          containers:
          - name: backup
            image: alpine:latest
            command:
            - /bin/sh
            - -c
            - |
              set -e
              BACKUP_DIR="/vault-backups"
              VAULT_PATH="/vault"
              DATE=$(date +%Y-%m-%d_%H-%M-%S)
              BACKUP_FILE="$BACKUP_DIR/vault-backup-$DATE.tar.gz"
              
              echo "📦 Starting vault backup..."
              mkdir -p "$BACKUP_DIR"
              
              # Create backup
              tar --exclude='.git/objects' \
                  --exclude='.obsidian/plugins/*/node_modules' \
                  --exclude='node_modules' \
                  --exclude='.DS_Store' \
                  -czf "$BACKUP_FILE" \
                  -C "$(dirname $VAULT_PATH)" \
                  "$(basename $VAULT_PATH)" 2>/dev/null
              
              if [ $? -eq 0 ]; then
                SIZE=$(du -h "$BACKUP_FILE" | cut -f1)
                echo "✅ Backup created: $BACKUP_FILE ($SIZE)"
              else
                echo "❌ Backup failed"
                exit 1
              fi
              
              # Clean old backups (keep last 30 days)
              echo "🧹 Cleaning old backups..."
              find "$BACKUP_DIR" -name "vault-backup-*.tar.gz" -mtime +30 -delete
              REMAINING=$(ls "$BACKUP_DIR"/vault-backup-*.tar.gz 2>/dev/null | wc -l)
              echo "✅ Kept $REMAINING recent backups"
            volumeMounts:
            - name: vault-storage
              mountPath: /vault
            - name: backup-storage
              mountPath: /vault-backups
            resources:
              requests:
                memory: "256Mi"
                cpu: "100m"
              limits:
                memory: "512Mi"
                cpu: "500m"
          volumes:
          - name: vault-storage
            persistentVolumeClaim:
              claimName: vault-storage-pvc
          - name: backup-storage
            emptyDir:
              sizeLimit: 100Gi
